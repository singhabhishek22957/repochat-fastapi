services:

  mongo:
    image: mongo
    container_name: repochat-mongo
    ports: 
      - "27017:27017"
    
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    
    volumes:
      - mongo_data:/data/db
    
    restart: unless-stopped

    networks:
      - repochat-network

  redis:
    image: redis:8-alpine
    container_name: repochat-redis
    ports: 
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

    networks:
      - repochat-network


  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    
    ports:
      - "8000:8000"
    
    env_file:
      - ./backend/.env
    
    volumes:
      - ./backend:/app
      - repo_data:/app/repositories
    
    depends_on:
      - mongo
      - redis

    restart: unless-stopped

    networks:
      - repochat-network
  
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - repo_data:/app/repositories
    restart: unless-stopped
    networks:
      - repochat-network



  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - repochat-network


volumes:
  mongo_data:
  redis_data:
  repo_data:
networks:
  repochat-network:
    driver: bridge


    
